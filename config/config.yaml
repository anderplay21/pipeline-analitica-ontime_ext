# Configuración general del pipeline analítica-ontime
# No pongas credenciales aquí — eso va en .env

sql_server:
  # Servidor corporativo (instancia por defecto, puerto 1433). SQL Server 2019 Standard,
  # en modo mixto: acepta tanto autenticación de Windows como logins SQL.
  servidor: "ICOLDATA01N"
  base_datos: "AnaliticaOperativa"
  driver: "ODBC Driver 18 for SQL Server"
  # false = login SQL, con SQL_USUARIO / SQL_PASSWORD de config/.env.
  # true  = autenticación de Windows, con la cuenta de dominio que ejecuta el proceso
  #         (requiere que el DBA le dé permisos: ver sql/06_permisos_pipeline.sql).
  trusted_connection: false
  trust_server_certificate: true
  # Segundos de espera para establecer la conexión. En un servidor remoto conviene un
  # límite explícito: si la red o el servidor no responden, la corrida falla rápido y
  # queda registrada en core.ETL_Control en vez de quedarse colgada.
  timeout_conexion: 30

sharepoint:
  # Sitio y biblioteca reales (ver extraer_desde_sharepoint_script1.py original)
  sitio_url: "https://icoltranssas.sharepoint.com/sites/Consolidadodeestatus-SAC"
  biblioteca: "Documentos compartidos"
  extensiones_permitidas: [".xlsx", ".xlsb"]
  # Nombre de hoja a buscar dentro de cada libro (tolera variaciones: mayúsculas, sufijo de mes, etc.)
  hoja_buscar: "consolidado"
  # Cache local de libros descargados y del token MSAL (device code), no se versiona
  carpeta_cache: "data_raw_backup/_cache_sharepoint"
  ruta_cache_token: "data_raw_backup/_cache_sharepoint/.msal_token_cache.json"
  # Client id público de Microsoft Office, usado por el flujo device code
  client_id_publico: "d3590ed6-52b3-4102-aeff-aad2292ab01c"

ventana_movil:
  meses_atras: 1   # 0 = solo mes actual, 1 = mes actual + mes anterior

# Esquema fijo de columnas que se extraen de cada libro de SharePoint (antes de transformar).
# Solo estas columnas salen del consolidado; el resto se descarta y se reporta.
