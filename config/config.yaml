  - "Cl/ Movimiento"
  - "Cl Doc FWO"
  - "Fecha de Factura"
  - "Ciudad Origen"
  - "Centro Origen"
  - "Destinatario"
  - "Ciudad Destino"
  - "Centro Destino"
  - "Factura"
  - "Carta Porte"
  - "Orden de Compra"
  - "Orden de Pedido"
  - "Remision"
  - "Ultima Ubicación"
  - "Fecha Programada De Entrega"
  - "Hora_Cita"
  - "Tipo Producto"
  - "ESTATUS"
  - "Novedad / Causal"
  - "FECHA ENTREGA"
  - "FECHA DE CITA"
  - "DOCUWARE"
  - "RESPONSABLE"

# Datos de referencia usados en la transformación (copiados de data_projects/datasets)
datos_referencia:
  carpeta: "data_referencia"
  leadtime: "LeadTime.csv"
  causales: "Causales.csv"
  festivos: "Festivos_Colombia.csv"
  restricciones: "Restricciones.csv"

# Única tabla del pipeline: consolidado de estatus On Time
tablas:
  hechos_ontime:
    tabla_core: "core.HechosOnTime"
    tabla_staging: "staging.HechosOnTime_Stage"
    llave_negocio: ["Cliente", "Fecha de Factura", "Factura"]
    columna_fecha: "Fecha de Factura"
    # Columnas sobre las que se calcula el RowHash (todas las de negocio, sin las técnicas)
    columnas_hash:
      - "Cliente"
      - "Cl/ Movimiento"
      - "Cl Doc FWO"
      - "Fecha de Factura"
      - "Ciudad Origen"
      - "Centro Origen"
      - "Destinatario"
      - "Ciudad Destino"
      - "Centro Destino"
      - "Factura"
      - "Carta Porte"
      - "Orden de Compra"
      - "Orden de Pedido"
      - "Remision"
      - "Ultima Ubicación"
      - "Fecha Programada De Entrega"
      - "Hora_Cita"
      - "Tipo Producto"
      - "ESTATUS"
      - "Novedad / Causal"
      - "FECHA ENTREGA"
      - "FECHA DE CITA"
      - "DOCUWARE"
      - "Lead Time"
      - "Fecha Estimada Entrega"
      - "RESPONSABLE"
      - "Origen_Destino"
      - "Nombre del mes"
      - "ON TIME ACIDO"
      - "ON TIME JUSTIFICADO"

logging:
  carpeta: "logs"
  nivel: "INFO"
  rotacion_dias: 30

notificaciones:
  email_habilitado: false
